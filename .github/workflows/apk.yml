name: APK para Android

# Compila la app (carpeta app/) como APK de Android y la publica en la
# release "apk", con un link de descarga fijo:
# https://github.com/Turuleca82/turuleca82.github.io/releases/download/apk/GymPlan.apk

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest ya trae el Android SDK (ANDROID_HOME) con las licencias aceptadas.
      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web app
        run: npm run build

      - name: Generar proyecto Android
        run: |
          npx cap add android
          npx cap sync android

      # Firma fija: la clave esta guardada en el secreto ANDROID_KEYSTORE
      # (archivo .p12 en base64). Con la misma firma, cada version nueva se
      # instala encima de la anterior sin borrar los datos. Sin el secreto se
      # usa una clave temporal (sirve para instalar, no para actualizar).
      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/gymplan.p12"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE: el APK se firma con una clave temporal y no va a poder actualizar una version anterior."
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/gymplan.p12" -storepass gymplan-firma \
              -keypass gymplan-firma -alias gymplan -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=GymPlan"
          fi

      # versionCode creciente: Android no deja instalar una version "anterior".
      - name: Numero de version
        working-directory: app/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + GITHUB_RUN_NUMBER))/; s/versionName \"[^\"]*\"/versionName \"1.$GITHUB_RUN_NUMBER\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Compilar APK
        working-directory: app/android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/gymplan.p12" \
            -Pandroid.injected.signing.store.password=gymplan-firma \
            -Pandroid.injected.signing.key.alias=gymplan \
            -Pandroid.injected.signing.key.password=gymplan-firma

      - name: Renombrar APK y mostrar la firma
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GymPlan.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs GymPlan.apk | grep -i "SHA-256"

      - name: Publicar en la release "apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --title "GymPlan para Android" --notes "Descargá GymPlan.apk desde el celular y abrilo para instalarlo. Si Android pregunta, permití instalar apps desde el navegador (Chrome) y, si aparece Play Protect, tocá Más detalles → Instalar de todas formas."
          fi
          gh release upload apk GymPlan.apk --clobber
