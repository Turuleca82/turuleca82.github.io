name: Publicar GymPlan

# Compila la app (carpeta app/) y publica la version lista para usar:
# - en la raiz de la rama main (lo que GitHub Pages sirve por defecto), y
# - en la rama gh-pages.
# Asi la pagina funciona con cualquiera de las dos opciones de Pages.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Compilar
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Publicar en la rama gh-pages
        working-directory: app/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publicar GymPlan web (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          rm -rf .git

      - name: Publicar en la raiz de main
        run: |
          # Borrar la version publicada anterior (todo menos el codigo y la config).
          find . -mindepth 1 -maxdepth 1 ! -name app ! -name .github ! -name .git ! -name README.md -exec rm -rf {} +
          cp -r app/dist/. .
          rm -rf app/dist app/node_modules
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publicar GymPlan web (${GITHUB_SHA::7})"
          git push -q origin HEAD:main
